name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build RawDrop Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/RawDrop.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawDrop-Android-v1.0.0
          path: build-output/RawDrop.apk
          if-no-files-found: error
